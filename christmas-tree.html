<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 圣诞树</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #050510;
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  canvas { display: block; }
  #tip {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.35);
    font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">拖动可以旋转 · 滚轮缩放</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 3D 点云 ---------------- */
// 点: {x,y,z, r大小, c颜色, tw闪烁相位, mode: 0树体/1灯串/2星星/3树干}
const points = [];
const TREE_H = 320;      // 树冠高度
const TREE_R = 150;      // 底部半径
const SPIRAL = 5.2;      // 灯串螺旋圈数

function rand(a, b) { return a + Math.random() * (b - a); }

// 树冠主体：绿色粒子，沿圆锥体积分布（越往上越密，形成立体感）
for (let i = 0; i < 3400; i++) {
  const t = Math.pow(Math.random(), 0.85);        // 0=顶 1=底
  const layer = 1 - t;                            // 归一化高度
  const rr = TREE_R * layer * Math.sqrt(Math.random());
  const ang = Math.random() * Math.PI * 2;
  points.push({
    x: Math.cos(ang) * rr,
    y: -TREE_H / 2 + t * TREE_H,
    z: Math.sin(ang) * rr,
    r: rand(1.0, 2.2),
    c: [40 + Math.random() * 60, 200 + Math.random() * 55, 90 + Math.random() * 60],
    tw: Math.random() * Math.PI * 2,
    mode: 0
  });
}

// 金色灯串：螺旋缠绕在树冠表面 + 少量随机彩灯
for (let i = 0; i < 190; i++) {
  const t = i / 190;
  const ang = t * Math.PI * 2 * SPIRAL;
  const rr = TREE_R * (1 - t) + 3;
  const gold = Math.random() < 0.72;
  points.push({
    x: Math.cos(ang) * rr,
    y: -TREE_H / 2 + t * TREE_H,
    z: Math.sin(ang) * rr,
    r: rand(1.2, 1.9),
    c: gold ? [255, 200 + Math.random() * 40, 60] : [255, rand(80, 120), rand(100, 160)],
    tw: Math.random() * Math.PI * 2,
    mode: 1
  });
}

// 树干
for (let i = 0; i < 70; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rr = 14 * Math.sqrt(Math.random());
  points.push({
    x: Math.cos(ang) * rr,
    y: TREE_H / 2 + Math.random() * 30,
    z: Math.sin(ang) * rr,
    r: rand(1.0, 1.8),
    c: [80, 45, 22],
    tw: 0,
    mode: 3
  });
}

// 顶部星星：五角星上的粒子
{
  const starR = 34;
  const starY = -TREE_H / 2 - 38;
  const starPts = [];
  const N = 5;
  for (let i = 0; i <= N * 2; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / N;
    const rr = i % 2 === 0 ? starR : starR * 0.42;
    starPts.push([Math.cos(ang) * rr, starY + Math.sin(ang) * rr]);
  }
  for (let seg = 0; seg < N * 2; seg++) {
    const [x1, y1] = starPts[seg], [x2, y2] = starPts[seg + 1];
    for (let k = 0; k < 14; k++) {
      const t = k / 14;
      const jit = (Math.random() - 0.5) * 2.2;
      points.push({
        x: x1 + (x2 - x1) * t + jit,
        y: y1 + (y2 - y1) * t + jit,
        z: 0,
        r: rand(1.4, 2.4),
        c: [255, 230, 120],
        tw: Math.random() * Math.PI * 2,
        mode: 2
      });
    }
  }
  // 星星光晕
  for (let i = 0; i < 90; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rr = starR * (0.4 + Math.random() * 1.1);
    points.push({
      x: Math.cos(ang) * rr,
      y: starY + Math.sin(ang) * rr,
      z: rand(-8, 8),
      r: rand(0.5, 1.2),
      c: [255, 235, 150],
      tw: Math.random() * Math.PI * 2,
      mode: 2
    });
  }
}

/* ---------------- 交互 ---------------- */
let rotY = 0, rotX = -0.08;
let autoSpin = 0.006;
let velY = 0, velX = 0;
let scale = 1;
let dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  velY = (e.clientX - lastX) * 0.005;
  velX = (e.clientY - lastY) * 0.005;
  rotY += velY;
  rotX = Math.max(-1.2, Math.min(1.2, rotX + velX));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  scale = Math.max(0.4, Math.min(2.4, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
}, { passive: true });

/* ---------------- 飘雪 ---------------- */
const snow = [];
for (let i = 0; i < 140; i++) {
  snow.push({
    x: Math.random() * 2000,
    y: Math.random() * 1200,
    s: rand(0.6, 2.2),
    v: rand(0.3, 1.1),
    d: rand(-0.4, 0.4)
  });
}

/* ---------------- 渲染循环 ---------------- */
const FOV = 480;
let time = 0;

function project(p, sy, cx) {
  // 绕Y旋转
  const cosY = Math.cos(sy), sinY = Math.sin(sy);
  let x = p.x * cosY - p.z * sinY;
  let z = p.x * sinY + p.z * cosY;
  // 绕X旋转
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  let y = p.y * cosX - z * sinX;
  z = p.y * sinX + z * cosX;
  const s = FOV / (FOV + z + 320);
  return { x: cx + x * s * scale, y: CY + y * s * scale, s, z };
}

function frame() {
  time += 0.016;
  if (!dragging) {
    rotY += autoSpin + velY;
    velY *= 0.94;
    rotX += velX;
    velX *= 0.9;
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // 背景微光晕（树底的氛围光）
  const glow = ctx.createRadialGradient(CX, CY + 60, 0, CX, CY + 60, Math.max(W, H) * 0.55);
  glow.addColorStop(0, 'rgba(30,80,50,0.22)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 飘雪
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (const f of snow) {
    f.y += f.v;
    f.x += f.d + Math.sin(time + f.y * 0.01) * 0.3;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
    if (f.x > W + 5) f.x = -5;
    if (f.x < -5) f.x = W + 5;
    ctx.globalAlpha = 0.25 + f.s / 4;
    ctx.beginPath();
    ctx.arc(f.x % (W + 10), f.y, f.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 粒子（发光叠加模式）
  ctx.globalCompositeOperation = 'lighter';
  for (const p of points) {
    const pr = project(p, rotY, CX);
    if (pr.z > FOV) continue;
    const size = Math.max(0.5, p.r * pr.s * scale * 1.7);
    const twinkle = p.mode === 0
      ? 0.55 + 0.25 * Math.sin(time * 2 + p.tw)
      : 0.7 + 0.3 * Math.sin(time * 3 + p.tw);
    const [r, g, b] = p.c;
    const a = (p.mode === 3 ? 0.45 : twinkle) * Math.min(1, pr.s * 1.2);

    // 外圈光晕（星星光晕大，灯串光晕小）
    if (p.mode !== 0) {
      const halo = p.mode === 2 ? 3.2 : 2.2;
      ctx.globalAlpha = a * (p.mode === 2 ? 0.25 : 0.15);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, size * halo, 0, Math.PI * 2);
      ctx.fill();
    }
    // 核心亮点
    ctx.globalAlpha = a;
    ctx.fillStyle = p.mode === 0
      ? `rgba(${r | 0},${g | 0},${b | 0},0.9)`
      : `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
